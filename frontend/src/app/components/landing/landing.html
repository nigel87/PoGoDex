<div class="landing-container">
  <!-- Sfondo animato con auras ed elementi Pokéball fluttuanti -->
  <div class="background-decorations">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="pokeball-silhouette silhouette-1"></div>
    <div class="pokeball-silhouette silhouette-2"></div>
  </div>

  <!-- Pannello Centrale Glassmorphic -->
  <div class="landing-card glass-card fade-in-slide">
    <div class="brand-header">
      <h1 class="logo">PoGO<span>Dex</span></h1>
      <p class="tagline">Traccia la tua Collezione Pokémon GO con Stile</p>
    </div>

    <div class="welcome-text">
      <h2>Inizia il tuo Viaggio</h2>
      <p>Gestisci spunte indipendenti per Shiny, Ombra, Purificati, 100% IV, Fortunati, XXL, XXS, Mega e Gigamax.</p>
    </div>

    <!-- Modulo Input Nome Allenatore -->
    <form (submit)="onSubmit(); $event.preventDefault();" class="trainer-form">
      <div class="input-group" [class.shake]="showError()">
        <label for="trainer-name">Inserisci il tuo Nome Allenatore</label>
        <div class="input-wrapper">
          <span class="input-prefix">@</span>
          <input 
            id="trainer-name"
            type="text" 
            placeholder="Es: TrainerName" 
            [ngModel]="trainerName()" 
            (ngModelChange)="trainerName.set($event)"
            name="trainerName"
            autocomplete="off"
            required>
        </div>
        <span class="error-msg" *ngIf="showError()">Il nome allenatore è richiesto!</span>
      </div>

      <button type="submit" class="submit-btn">
        <span>Esplora Pokédex</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </form>
  </div>
</div>
